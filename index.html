<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUITI · จดหมายจากพี่รหัส</title><link rel="stylesheet" href="style.css">
<style>
main{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(440px,100%);padding:38px 30px;text-align:center}
.logo{letter-spacing:.45em;font-size:13px;color:var(--mut);margin-bottom:14px}
.heart{font-size:46px;color:var(--rose);filter:drop-shadow(0 0 14px var(--rose));animation:bt 2s infinite}
@keyframes bt{50%{transform:scale(1.15)}}
h1{margin:6px 0;font-weight:600;font-size:30px;background:linear-gradient(90deg,#ffd0e2,#c9b6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--mut);margin:6px 0 20px;font-size:15px}.f{display:grid;gap:12px}.sm{font-size:12px;margin:18px 0 0;font-style:italic}
#msg{color:#ff9db8;min-height:20px;margin-top:10px;font-size:14px}
.env{position:relative;width:230px;height:150px;margin:20px auto 0}
.env .bk{position:absolute;inset:0;background:linear-gradient(160deg,#3a2466,#241446);border-radius:10px;border:1px solid #ffffff30}
.env .fl{position:absolute;left:0;right:0;top:0;height:80px;background:#4a2f80;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;animation:op 1s .2s forwards;z-index:3;border-radius:10px 10px 0 0}
.env .lt{position:absolute;left:14px;right:14px;top:10px;height:120px;background:#fff4f8;border-radius:8px;animation:up 1s 1s forwards;z-index:2;color:#7a2a55;display:grid;place-items:center;font-size:34px}
.env .fr{position:absolute;inset:0;z-index:4;background:linear-gradient(160deg,#5a3a99,#33205c);clip-path:polygon(0 100%,0 35%,50% 65%,100% 35%,100% 100%);border-radius:10px}
@keyframes op{to{transform:rotateX(180deg);z-index:1}}@keyframes up{to{transform:translateY(-70px)}}
#res{display:none;margin-top:90px;animation:in 1s 1.8s both}@keyframes in{from{opacity:0;transform:translateY(12px)}}
.hint{margin:14px 0;padding:18px;border-radius:16px;background:linear-gradient(135deg,#ff6fa530,#9b7bff30);border:1px solid #ff6fa566;font-size:20px;line-height:1.5;box-shadow:0 0 30px #ff6fa533}
</style></head><body><main><div class="card glass"><div class="logo">BUITI · ITI</div>
<div id="form"><div class="heart">💗</div><h1>จดหมายจากพี่รหัส</h1><p>กรอกรหัสนักศึกษาของน้องเพื่อเปิดจดหมายจากพี่รหัสของคุณ</p>
<div class="f"><input id="sid" inputmode="numeric" maxlength="10" placeholder="กรอกรหัสนักศึกษา" autocomplete="off"><button id="go" class="btn">เปิดจดหมาย</button></div><div id="msg"></div><p class="sm">A little surprise is waiting for you.</p></div>
<div id="out" style="display:none"><div class="env"><div class="bk"></div><div class="lt">💌</div><div class="fl"></div><div class="fr"></div></div>
<div id="res"><h1>You’ve got a letter!</h1><p style="margin:0">Your Senior Code is…</p><div class="hint" id="hint"></div><p>Someone is waiting to get to know you.</p><button class="btn ghost" onclick="location.reload()">กลับหน้าแรก</button></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><script src="fx.js"></script>
<script>
const sb=supabase.createClient(CFG.URL,CFG.KEY),$=i=>document.getElementById(i);
const err=t=>$('msg').textContent=t;
$('go').onclick=async()=>{const id=$('sid').value.trim();err('');
 if(!/^\d{10}$/.test(id))return err('กรุณากรอกรหัสนักศึกษา 10 หลักให้ถูกต้อง');
 $('go').disabled=true;$('go').textContent='กำลังเปิดจดหมาย…';
 try{const{data,error}=await sb.rpc('get_letter',{p_id:id});if(error)throw error;await new Promise(r=>setTimeout(r,800));
  if(data.status==='not_found')err('ไม่พบรหัสนักศึกษานี้ในระบบ');
  else if(data.status==='unmatched')err('ยังไม่พบคู่ของคุณ โปรดรอประกาศผลอีกครั้ง');
  else{$('hint').textContent=data.hint;$('form').style.display='none';$('out').style.display='block';$('res').style.display='block'}
 }catch(e){err('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง')}
 $('go').disabled=false;$('go').textContent='เปิดจดหมาย'};
$('sid').onkeydown=e=>e.key==='Enter'&&$('go').click();
</script></body></html>
